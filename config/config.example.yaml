# Copy to config.yaml and replace every value marked with TODO.
cnap:
  api_url: "https://cnap_lviv.qsolutions.com.ua:2651"
  frontend_origin: "https://cnap-lviv.qsolutions.com.ua:2657"
  # The current CNAP endpoint requires this setting. Turn it on when its TLS
  # certificate chain is valid for your environment.
  verify_ssl: false
  request_timeout_seconds: 15

defaults:
  timezone: Europe/Kyiv
  start_hour: 5
  check_interval_seconds: 60
  preferred_hours: ["09:00", "12:00"]

